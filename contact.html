<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us – Sarima</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <nav class="navbarabt">
    <a href="#" class="logo">Sarima</a>

    <div class="nav-links">
      <div class="nav-mid">
      <a href="index.html">Home</a>
      <a href="explore.html">Explore</a>
      </div>
  
    </div>
  </nav>
  <main class="contact-wrapper">

    <div class="form-side">
      <p class="form-label">Feedback Form</p>

      <div class="field-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your full name" />
      </div>

      <div class="field-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>

      <div class="field-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="+234 00 000 000" />
      </div>

      <div class="field-group">
        <label for="message">Message</label>
        <textarea id="message" rows="4" placeholder="Write your message..."></textarea>
      </div>

      <div class="form-actions">
        <button class="btn-send">
          Send Message
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="info-side">

      <div class="info-block">
        <p class="info-eyebrow">Contact Us</p>
        <h1 class="info-heading">Let's Work<br>Together</h1>
        <p class="info-sub">Have a project in mind or just want to say hello? Fill in the form and we'll get back to you.</p>
      </div>

      <div class="info-details">

        <div class="info-item">
          <p class="info-item-label">Our Address</p>
          <p class="info-item-value">89, Niyi Onilari<br>Ago Palace way, Lagos, NG</p>
        </div>

        <div class="info-item">
          <p class="info-item-label">Our Contacts</p>
          <p class="info-item-value">williams.adele.dev@gmail.com<br>+234 90 3669 0778</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
